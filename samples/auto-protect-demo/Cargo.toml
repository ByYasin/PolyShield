[package]
name = "auto-protect-demo"
description = "Tek çağrıyla tüm-modül otomatik şeffaf koruma demosu (Faz 5+)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
poly-rt = { path = "../../crates/poly-rt" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }

[[bin]]
name = "auto-protect-demo"
path = "src/main.rs"
