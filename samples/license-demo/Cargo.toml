[package]
name = "license-demo"
description = "PolyShield örnek hedef (#[poly_virtualize] gösterimi, cdylib)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
poly-macros = { path = "../../crates/poly-macros" }

# cdylib: #[export_name] ile işaretli fonksiyonlar PE/ELF export tablosunda görünür,
# böylece post-build `shield` otopilotu onları bulabilir.
[lib]
name = "license_demo"
crate-type = ["cdylib"]
path = "src/lib.rs"
